{% extends "base.html" %}

{% block content %}

<h2>開催日一覧</h2>
<ul>
{% for d in days %}

{% endfor %}
</ul>

<p><a href="../../annual/{{year}}.html">← {{year}}年 年間成績へ戻る</a></p>
<p><a href="../../index.html">← AI成績メインへ戻る</a></p>
{% endblock %}
